<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valegends</title>
<style>
  /* ============================================================
     VALEGENDS — single-file story/survival game
     - Exact HUD from the reference sheets:
         heart + red health bar, lightning + blue stamina bar (top-left)
         round compass minimap (top-right)
         centered gold "Press [E] to ..." prompt
         location label box (bottom)
     - Scenes are drawn as layered SVG (illustrated-vector style).
     - Every location & hero has an optional IMAGE SLOT: set `img`
       to a file path/URL and it renders that instead of the SVG,
       giving you painted-art quality with zero code changes.
     ============================================================ */

  :root{
    --gold:#e8c15a; --gold-bright:#ffd873;
    --panel:#2b2b33; --panel-2:#202026; --ink:#f4efe3;
    --hp:#e5484d; --hp-dark:#5a1416;
    --sta:#3aa0e0; --sta-dark:#123047;
    --frame:#12141a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#05060a;color:var(--ink);
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;overflow:hidden;
    -webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  /* 16:9 letterboxed viewport so it feels like a real game window */
  #view{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);
    background:#0a0d14;overflow:hidden;box-shadow:0 0 60px #000 inset,0 0 0 2px #000}
  #scene{position:absolute;inset:0;will-change:transform;transform-origin:50% 76%}
  #scene svg,#scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  #scene::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 38%, transparent 55%, rgba(6,8,14,.42) 100%),
               linear-gradient(180deg, rgba(255,250,235,.10) 0%, transparent 22%, transparent 78%, rgba(6,8,14,.28) 100%)}
  .fade{position:absolute;inset:0;background:#05060a;opacity:0;pointer-events:none;
    transition:opacity .28s ease;z-index:40}
  .fade.on{opacity:1}

  /* ---------- HUD: health + stamina (top-left) ---------- */
  #bars{position:absolute;left:2.2%;top:4%;z-index:20;width:34%;max-width:430px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  .bar-row{display:flex;align-items:center;gap:.6vw;margin-bottom:.7vh}
  .icon{width:2.6vw;height:2.6vw;max-width:34px;max-height:34px;min-width:20px;min-height:20px;flex:0 0 auto}
  .bar{position:relative;flex:1;height:2vw;max-height:26px;min-height:15px;
    background:#1a1206;border:2px solid #000;border-radius:4px;overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.15) inset}
  .bar .fill{position:absolute;inset:0;width:100%;transform-origin:left;
    transition:transform .35s cubic-bezier(.4,0,.2,1)}
  .bar.hp .fill{background:linear-gradient(#ff6b6f,var(--hp) 55%,#b3282c)}
  .bar.sta .fill{background:linear-gradient(#8fd0ff,var(--sta) 55%,#1f76b8)}
  .bar .notch{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.28)}

  /* ---------- HUD: compass minimap (top-right) ---------- */
  #compass{position:absolute;right:2.4%;top:5%;z-index:20;
    width:12vw;height:12vw;max-width:150px;max-height:150px;min-width:88px;min-height:88px;
    border-radius:50%;border:3px solid #b98b3e;background:#7fa86a;overflow:hidden;
    box-shadow:0 0 0 3px #2c2016,0 6px 16px rgba(0,0,0,.6)}
  #compass svg{position:absolute;inset:0}
  .cdir{position:absolute;color:#fff;font-weight:700;font-size:.8vw;text-shadow:0 1px 2px #000;
    min-font-size:9px}
  .cdir.n{top:3%;left:50%;transform:translateX(-50%)}
  .cdir.s{bottom:3%;left:50%;transform:translateX(-50%)}
  .cdir.e{right:5%;top:50%;transform:translateY(-50%)}
  .cdir.w{left:5%;top:50%;transform:translateY(-50%)}

  /* ---------- centered "Press [E] to ..." prompt ---------- */
  #prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);z-index:20;
    font-size:1.7vw;font-weight:700;color:#fff;text-align:center;letter-spacing:.3px;
    text-shadow:0 2px 5px rgba(0,0,0,.9),0 0 2px #000;opacity:0;transition:opacity .2s;
    pointer-events:none;white-space:nowrap}
  #prompt.show{opacity:1}
  #prompt .k{color:var(--gold-bright)}

  /* ---------- location label box (bottom center) ---------- */
  #label{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);z-index:20;
    background:linear-gradient(#3a352b,#2a251d);color:var(--gold-bright);
    font-weight:700;font-size:1.25vw;padding:.5vh 1.4vw;border-radius:7px;
    border:2px solid #000;box-shadow:0 3px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.12) inset;
    letter-spacing:.4px;white-space:nowrap}

  /* ---------- travel controls (bottom) ---------- */
  #travel{position:absolute;left:2.4%;bottom:5%;z-index:20;display:flex;gap:.5vw;flex-wrap:wrap;max-width:44%}
  .tbtn{background:linear-gradient(#3b3630,#242019);color:#f0e6cf;border:2px solid #000;
    border-radius:6px;padding:.5vh .9vw;font-size:.95vw;font-weight:700;cursor:pointer;
    box-shadow:0 2px 4px rgba(0,0,0,.5);transition:transform .08s,filter .12s}
  .tbtn:hover{filter:brightness(1.18)}
  .tbtn:active{transform:translateY(1px)}
  .tbtn .dir{color:var(--gold);font-weight:800;margin-right:.35em}
  #actions{position:absolute;right:2.4%;bottom:5%;z-index:20;display:flex;gap:.5vw}
  .abtn{background:linear-gradient(#4a3f22,#2f2712);color:var(--gold-bright);
    border:2px solid #000;border-radius:6px;padding:.5vh 1vw;font-size:.95vw;font-weight:800;
    cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.5)}
  .abtn:hover{filter:brightness(1.2)}
  .abtn.hidden{display:none}

  /* ---------- toast / story popup ---------- */
  #toast{position:absolute;left:50%;top:16%;transform:translateX(-50%) translateY(-14px);
    z-index:30;background:rgba(18,20,26,.94);border:2px solid var(--gold);border-radius:10px;
    color:#f4efe3;padding:1.1vh 1.6vw;max-width:52%;font-size:1vw;text-align:center;
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
    box-shadow:0 8px 30px rgba(0,0,0,.6)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast b{color:var(--gold-bright)}

  /* ---------- modal (hero select / info / dialogue) ---------- */
  .modal{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(4,5,9,.82)}
  .modal.on{display:flex}
  .card{background:linear-gradient(#2a2a33,#1c1c22);border:2px solid var(--gold);border-radius:14px;
    padding:2.2vh 2vw;max-width:80%;max-height:88%;overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .card h1{font-size:2.2vw;margin:.2em 0;color:var(--gold-bright);text-align:center;letter-spacing:1px}
  .card h2{font-size:1.1vw;margin:.2em 0;color:var(--gold);text-align:center;font-weight:600}
  .sub{text-align:center;opacity:.8;font-size:.95vw;margin-bottom:1.4vh}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1vw;margin-top:1.4vh}
  .hero{background:#15161c;border:2px solid #3a3a44;border-radius:10px;padding:1vh .6vw;cursor:pointer;
    text-align:center;transition:transform .1s,border-color .12s,background .12s}
  .hero:hover{border-color:var(--gold);transform:translateY(-3px);background:#1b1d25}
  .hero svg{width:100%;height:9vh;min-height:70px}
  .hero .nm{font-weight:800;font-size:.95vw;margin-top:.4vh}
  .hero .cl{font-size:.78vw;opacity:.8}
  .hero .sk{font-size:.72vw;color:var(--gold);margin-top:.3vh;min-height:1.9em}
  .row{display:flex;gap:1.4vw;align-items:center}
  .btnbar{display:flex;gap:1vw;justify-content:center;margin-top:1.8vh}
  .big{background:linear-gradient(#4a3f22,#2f2712);color:var(--gold-bright);border:2px solid #000;
    border-radius:8px;padding:1vh 2vw;font-size:1.1vw;font-weight:800;cursor:pointer}
  .big:hover{filter:brightness(1.2)}
  .kv{font-size:1vw;line-height:1.7}
  .kv b{color:var(--gold-bright)}
  .bag{display:flex;flex-wrap:wrap;gap:.5vw;margin-top:.6vh}
  .pill{background:#15161c;border:1px solid #3a3a44;border-radius:20px;padding:.3vh .9vw;font-size:.85vw}
  .pill b{color:var(--gold-bright)}
  .hint{position:absolute;right:2.4%;top:26%;z-index:20;font-size:.8vw;opacity:.55;text-align:right;
    line-height:1.6;text-shadow:0 1px 2px #000}
  .quest{position:absolute;left:2.2%;top:15%;z-index:20;font-size:.82vw;opacity:.9;
    background:rgba(10,12,18,.5);border-left:3px solid var(--gold);padding:.4vh .7vw;border-radius:0 6px 6px 0;
    max-width:30%;text-shadow:0 1px 2px #000}
  .quest b{color:var(--gold-bright)}
  .dead{color:#ff8a8a}

  /* ---------- IMAGE MODE: your painted panels are the whole scene.
     The baked-in HUD is part of the art; the live game UI lives in a
     single bottom bar so nothing doubles up. ---------- */
  body.imgmode #bars,body.imgmode #compass,body.imgmode #prompt,
  body.imgmode #label,body.imgmode .hint,body.imgmode .quest,
  body.imgmode #travel,body.imgmode #actions{display:none!important}
  #hud{display:none}
  body.imgmode #hud{display:flex;position:absolute;left:0;right:0;bottom:0;z-index:25;
    align-items:center;gap:.8vw;padding:1vh 1.1vw 1.1vh;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(8,10,16,0) 0%,rgba(8,10,16,.72) 38%,rgba(6,8,12,.96) 100%)}
  .hud-bars{flex:0 0 auto;width:19%;min-width:140px}
  .hud-row{display:flex;align-items:center;gap:.5vw;margin-bottom:.5vh}
  .hud-row .ic{width:1.8vw;height:1.8vw;max-width:24px;max-height:24px;min-width:15px;flex:0 0 auto}
  .hbar{position:relative;flex:1;height:1.4vw;max-height:18px;min-height:11px;background:#140d05;
    border:2px solid #000;border-radius:4px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
  .hbar .f{position:absolute;inset:0;transform-origin:left;transition:transform .35s cubic-bezier(.4,0,.2,1)}
  .hbar.hp .f{background:linear-gradient(#ff6b6f,#e5484d 55%,#b3282c)}
  .hbar.sta .f{background:linear-gradient(#8fd0ff,#3aa0e0 55%,#1f76b8)}
  .hbar .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:.72vw;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;min-font-size:9px}
  .hud-travel{flex:0 0 auto;display:flex;gap:.4vw;flex-wrap:wrap;max-width:26%}
  .navb{background:linear-gradient(#3b3630,#242019);color:#f0e6cf;border:2px solid #000;border-radius:6px;
    padding:.5vh .7vw;font-size:.82vw;font-weight:700;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.5);white-space:nowrap}
  .navb:hover{filter:brightness(1.2)}.navb:active{transform:translateY(1px)}
  .navb .d{color:var(--gold);font-weight:800;margin-right:.3em}
  .hud-mid{flex:1 1 120px;text-align:center;min-width:0;order:0}
  .hud-loc{font-size:1.05vw;font-weight:800;color:var(--gold-bright);text-shadow:0 2px 4px #000;letter-spacing:.4px}
  .hud-sub{font-size:.78vw;color:#e8e0cf;opacity:.9;text-shadow:0 1px 2px #000;margin-top:.2vh}
  .hud-sub b{color:var(--gold-bright)}
  .hud-act{flex:1 1 auto;display:flex;gap:.45vw;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .actb{background:linear-gradient(#4a3f22,#2f2712);color:var(--gold-bright);border:2px solid #000;
    border-radius:6px;padding:.5vh .7vw;font-size:.82vw;font-weight:800;cursor:pointer;
    box-shadow:0 2px 4px rgba(0,0,0,.5);white-space:nowrap}
  .actb:hover{filter:brightness(1.2)}.actb:active{transform:translateY(1px)}
  .actb.key{color:#fff}.actb .k{color:var(--gold-bright)}
  .actb.hot{border-color:var(--gold);box-shadow:0 0 10px rgba(232,193,90,.5)}
  #vign{position:absolute;inset:0;z-index:18;pointer-events:none;opacity:0;transition:opacity .5s;
    box-shadow:inset 0 0 22vw 4vw rgba(180,20,20,.65)}
  body.hurt #vign{opacity:1}
  .qbadge{position:absolute;left:1.4%;top:3.5%;z-index:24;background:rgba(10,12,18,.72);
    border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:.6vh .9vw;max-width:30%;
    font-size:.8vw;color:#f0e6cf;text-shadow:0 1px 2px #000;box-shadow:0 3px 10px rgba(0,0,0,.5);display:none}
  body.imgmode .qbadge.show{display:block}
  .qbadge b{color:var(--gold-bright)}
  .qbadge .done{color:#7fe07a}

  /* ============================================================
     WALK MODE — free-roam engine. You move a character sprite
     inside the painted scene; NPCs wander; items lie on the
     ground; edges lead to neighbouring areas. One compact HUD:
     small health+energy bottom-left, hotbar centre, gold right.
     ============================================================ */
  body.walkmode #hud,body.walkmode #bars,body.walkmode #compass,body.walkmode #prompt,
  body.walkmode #label,body.walkmode .hint,body.walkmode .quest,
  body.walkmode #travel,body.walkmode #actions{display:none!important}
  #world{position:absolute;inset:0;z-index:12;overflow:visible;display:none;
    will-change:transform;transform-origin:50% 76%}
  body.walkmode #world{display:block}

  /* ---- occluders: clipped copies of the scene that sprites pass BEHIND ---- */
  .occ{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    pointer-events:none}
  /* ---- per-scene light applied to every sprite so they sit in the scene ---- */
  #world{--sprlight:none}
  .sprite img.pspr,.sprite>svg{filter:var(--sprlight)}
  /* ---- footstep dust ---- */
  .dust{position:absolute;width:10px;height:6px;border-radius:50%;
    background:rgba(210,190,150,.5);pointer-events:none;
    animation:dustPuff .5s ease-out forwards}
  @keyframes dustPuff{from{transform:translate(-50%,-50%) scale(.5);opacity:.55}
    to{transform:translate(-50%,-140%) scale(1.6);opacity:0}}

  /* ---- atmosphere particles + mist (immersion layer) ---- */
  .pt{position:absolute;pointer-events:none;border-radius:50%;
    animation:ptFloat var(--dur) linear infinite}
  @keyframes ptFloat{
    0%{transform:translate(0,0) rotate(0deg);opacity:0}
    12%{opacity:var(--op)}
    88%{opacity:var(--op)}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
  .mist{position:absolute;pointer-events:none;border-radius:50%;
    filter:blur(18px);animation:mistDrift var(--dur) ease-in-out infinite alternate}
  @keyframes mistDrift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}

  /* ---- combat ---- */
  .ebar{position:absolute;left:8%;right:8%;bottom:102%;height:7px;background:#180a0a;
    border:1px solid #000;border-radius:3px;overflow:hidden;opacity:0;transition:opacity .2s}
  .ebar.show{opacity:1}
  .ebar .f{height:100%;background:linear-gradient(#ff6b6f,#c0301a);transform-origin:left;
    transition:transform .18s}
  .dmgnum{position:absolute;font-weight:900;font-size:1.3vw;pointer-events:none;z-index:1000;
    text-shadow:0 2px 3px #000,0 0 2px #000;animation:dmgUp .8s ease-out forwards}
  .dmgnum.hit{color:#ffd23a}.dmgnum.hurt{color:#ff5a5a}.dmgnum.crit{color:#ff9a2a;font-size:1.8vw}
  @keyframes dmgUp{from{transform:translate(-50%,0);opacity:1}
    to{transform:translate(-50%,-5vh);opacity:0}}
  .sprite.atk{animation:atkLunge .22s ease-out}
  @keyframes atkLunge{40%{margin-top:-1.2vh}100%{margin-top:0}}
  .sprite.ehurt img,.sprite.ehurt svg{filter:brightness(2.2) saturate(.4)}
  .sprite.edie{transition:opacity .5s,transform .5s;opacity:0!important}
  .sprite{position:absolute;transform-origin:50% 100%;pointer-events:none;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
  .sprite svg{display:block;width:100%;height:100%}
  .sprite .shadow{position:absolute;left:-6%;right:-6%;bottom:-3.5%;height:16%;
    background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.5),transparent 68%);
    border-radius:50%;filter:blur(2px)}
  .sprite img.pspr{width:100%;height:100%;object-fit:contain;display:block;
    transform-origin:50% 100%}
  .sprite.walking img.pspr{animation:sway .38s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-2.6deg) translateY(0)}to{transform:rotate(2.6deg) translateY(-3px)}}
  .sprite.walking .legA{animation:legA .38s ease-in-out infinite alternate}
  .sprite.walking .legB{animation:legB .38s ease-in-out infinite alternate}
  .sprite.walking .torso{animation:bob .38s ease-in-out infinite alternate}
  @keyframes legA{from{transform:rotate(20deg)}to{transform:rotate(-20deg)}}
  @keyframes legB{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
  .ntag{position:absolute;left:50%;transform:translateX(-50%);bottom:104%;
    background:rgba(10,12,18,.78);border:1px solid rgba(232,193,90,.6);border-radius:6px;
    padding:.15vh .5vw;font-size:.72vw;font-weight:700;color:var(--gold-bright);
    white-space:nowrap;text-shadow:0 1px 2px #000}
  .item-glint{animation:glint 1.6s ease-in-out infinite}
  @keyframes glint{0%,100%{filter:drop-shadow(0 0 3px rgba(255,230,150,.4))}
    50%{filter:drop-shadow(0 0 9px rgba(255,230,150,.95))}}
  .exit-arrow{position:absolute;z-index:14;color:#fff;font-size:1.6vw;font-weight:900;
    text-shadow:0 0 8px #000,0 2px 3px #000;opacity:.75;animation:pulse 1.6s infinite;pointer-events:none}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}
  .exit-arrow .lbl{font-size:.7vw;font-weight:700;color:var(--gold-bright);display:block;text-align:center}

  /* the single compact bottom HUD */
  #whud{display:none;position:absolute;left:0;right:0;bottom:0;z-index:26;
    align-items:flex-end;gap:1vw;padding:.8vh 1.1vw 1vh;
    background:linear-gradient(180deg,rgba(8,10,16,0),rgba(6,8,12,.85) 70%)}
  body.walkmode #whud{display:flex}
  #wbars{flex:0 0 auto;width:15%;min-width:120px}
  #wbars .hud-row{margin-bottom:.35vh}
  #wbars .hbar{height:1.1vw;max-height:14px;min-height:9px}
  #wbars .hbar .t{font-size:.6vw}
  #wbars .ic{width:1.3vw;height:1.3vw;max-width:17px;max-height:17px;min-width:11px}
  #hotbar{flex:0 0 auto;margin:0 auto;display:flex;gap:.4vw}
  .slot{position:relative;width:3.4vw;height:3.4vw;max-width:46px;max-height:46px;min-width:34px;min-height:34px;
    background:rgba(20,16,10,.85);border:2px solid #5a4a2a;border-radius:8px;cursor:pointer;
    box-shadow:0 2px 5px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.08) inset;
    display:flex;align-items:center;justify-content:center}
  .slot:hover{border-color:var(--gold)}
  .slot .num{position:absolute;top:1px;left:4px;font-size:.6vw;color:#c9b98a;font-weight:700}
  .slot .cnt{position:absolute;bottom:1px;right:4px;font-size:.65vw;color:#fff;font-weight:800;text-shadow:0 1px 2px #000}
  .slot .ico{font-size:1.5vw;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
  .slot.empty .ico{opacity:.18}
  #wright{flex:0 0 auto;margin-left:auto;text-align:right;font-size:.85vw;color:#f0e6cf;
    text-shadow:0 1px 2px #000;line-height:1.5}
  #wright b{color:var(--gold-bright)}
  #wloc{font-weight:800;color:var(--gold-bright);letter-spacing:.4px}

  /* walk-mode interact prompt (single, above hotbar) */
  #ep{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);z-index:24;
    font-size:1.4vw;font-weight:800;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 2px #000;
    white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
  #ep.show{opacity:1}
  #ep .k{color:var(--gold-bright)}

  /* inventory (Tab) */
  #inv .card{min-width:52%}
  #invGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:.6vw;margin-top:1vh}
  .invItem{position:relative;background:#15161c;border:2px solid #3a3a44;border-radius:10px;
    padding:.9vh .4vw 1.6vh;text-align:center;cursor:pointer;transition:border-color .12s,transform .1s}
  .invItem:hover{border-color:var(--gold);transform:translateY(-2px)}
  .invItem .ico{font-size:1.9vw}
  .invItem .nm{font-size:.72vw;margin-top:.3vh;color:#e8e0cf}
  .invItem .cnt{position:absolute;top:3px;right:7px;font-size:.75vw;font-weight:800;color:var(--gold-bright)}
  .invItem.inhot{border-color:var(--gold);background:#1f1c12}
  .invItem.inhot::after{content:"HOTBAR";position:absolute;bottom:2px;left:0;right:0;
    font-size:.55vw;color:var(--gold);font-weight:800;letter-spacing:.5px}
  @media (max-width:640px){

/* =====================================================================
   5) SCENE PAINTER  — layered SVG per biome (illustrated-vector look).
      Returns an <svg> string. Atmospheric perspective + gradients keep
      it looking like art rather than flat blocks.
   ===================================================================== */
const W=1600,H=900;
function svg(inner, defs=''){return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice"><defs>${defs}</defs>${inner}</svg>`;}
function grad(id,stops,x1=0,y1=0,x2=0,y2=1){
  return `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">`+
    stops.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"/>`).join('')+`</linearGradient>`;}
function rgrad(id,stops){return `<radialGradient id="${id}">`+stops.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"/>`).join('')+`</radialGradient>`;}

// reusable pieces --------------------------------------------------------
function sky(top,bot,sun){ // sun:{x,y,r,c}
  let d=grad('sky',[[0,top],[1,bot]]);
  let s='';
  if(sun){ d+=rgrad('sun',[[0,sun.c||'#fff7d6'],[.5,(sun.c||'#ffe9a8')+'aa'],[1,'#ffffff00']]);
    s=`<circle cx="${sun.x}" cy="${sun.y}" r="${sun.r}" fill="url(#sun)"/>`;}
  return {defs:d, body:`<rect width="${W}" height="${H}" fill="url(#sky)"/>${s}`};
}
function clouds(y,op=.8){let s='';for(let i=0;i<4;i++){const cx=180+i*380+(i%2?60:0),cy=y+(i%2?40:0);
  s+=`<g fill="#ffffff" opacity="${op*(.5+.12*i)}"><ellipse cx="${cx}" cy="${cy}" rx="120" ry="34"/><ellipse cx="${cx+90}" cy="${cy+8}" rx="90" ry="28"/><ellipse cx="${cx-80}" cy="${cy+10}" rx="80" ry="24"/></g>`;}
  return s;}
let _uid=0; const uid=()=>'g'+(++_uid);
// shade a hex color toward black by f (0..1)
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r*(1-f));g=Math.round(g*(1-f));b=Math.round(b*(1-f));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function tint(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.round(r+(255-r)*f);g=Math.round(g+(255-g)*f);b=Math.round(b+(255-b)*f);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function ridge(baseY,amp,color,seed=1,op=1){ // layered mountains w/ gradient + haze
  let p=`M0 ${H} L0 ${baseY}`;let x=0;let r=seed*97%50;
  while(x<=W){const nx=x+120+ (r%140); const ny=baseY-amp*(0.4+ (Math.sin((x+seed*40)/220)+1)/2*0.6);
    p+=` L${x} ${baseY} L${(x+nx)/2} ${ny}`; x=nx; r=(r*31+7)%97;}
  p+=` L${W} ${baseY} L${W} ${H} Z`;
  const id=uid();
  return `<defs><linearGradient id="${id}" x1="0" y1="${baseY-amp}" x2="0" y2="${baseY+120}" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="${tint(color,.18)}"/><stop offset="1" stop-color="${shade(color,.28)}"/></linearGradient></defs>
    <path d="${p}" fill="url(#${id})" opacity="${op}"/>`;
}
function snowcaps(baseY,amp,seed){let s='';let x=60;while(x<W){const ny=baseY-amp*.7;
  s+=`<path d="M${x-40} ${ny+40} L${x} ${ny} L${x+40} ${ny+40} L${x+18} ${ny+34} L${x} ${ny+16} L${x-18} ${ny+34} Z" fill="#f4f7ff" opacity=".9"/>
     <path d="M${x} ${ny} L${x+40} ${ny+40} L${x+18} ${ny+34} Z" fill="#c8d4e8" opacity=".7"/>`;x+=260;}return s;}
function pine(x,y,s,c1,c2){const d=shade(c1,.3),l=tint(c1,.12);return `<g>
  <rect x="${x-4*s}" y="${y}" width="${8*s}" height="${22*s}" fill="#4a3524"/>
  <polygon points="${x},${y-70*s} ${x-30*s},${y} ${x+30*s},${y}" fill="${c2}"/>
  <polygon points="${x},${y-70*s} ${x+30*s},${y} ${x},${y}" fill="${shade(c2,.22)}"/>
  <polygon points="${x},${y-95*s} ${x-26*s},${y-40*s} ${x+26*s},${y-40*s}" fill="${c1}"/>
  <polygon points="${x},${y-95*s} ${x+26*s},${y-40*s} ${x},${y-40*s}" fill="${d}"/>
  <polygon points="${x},${y-118*s} ${x-20*s},${y-72*s} ${x+20*s},${y-72*s}" fill="${l}"/>
  <polygon points="${x},${y-118*s} ${x+20*s},${y-72*s} ${x},${y-72*s}" fill="${c1}"/></g>`;}
function tree(x,y,s,c1,c2){const id=uid();const d=shade(c1,.28);return `<g>
  <defs><radialGradient id="${id}" cx=".4" cy=".35"><stop offset="0" stop-color="${tint(c1,.16)}"/>
    <stop offset="1" stop-color="${d}"/></radialGradient></defs>
  <rect x="${x-6*s}" y="${y-30*s}" width="${12*s}" height="${44*s}" rx="4" fill="#5a3d28"/>
  <circle cx="${x}" cy="${y-56*s}" r="${44*s}" fill="${shade(c2,.15)}"/>
  <circle cx="${x-34*s}" cy="${y-40*s}" r="${30*s}" fill="url(#${id})"/>
  <circle cx="${x+34*s}" cy="${y-40*s}" r="${30*s}" fill="url(#${id})"/>
  <circle cx="${x}" cy="${y-70*s}" r="${30*s}" fill="url(#${id})"/>
  <circle cx="${x-12*s}" cy="${y-64*s}" r="${16*s}" fill="${tint(c1,.22)}" opacity=".6"/></g>`;}
function ground(y,c){const id=uid();return `<defs><linearGradient id="${id}" x1="0" y1="${y}" x2="0" y2="${H}" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="${tint(c,.12)}"/><stop offset="1" stop-color="${shade(c,.22)}"/></linearGradient></defs>

// small helpers for painters
function grad0(){return '';}
function planks(base){let s='';for(let i=0;i<14;i++){s+=`<rect x="0" y="${i*64}" width="${W}" height="2" fill="#000"/>`;}return s;}
function house(x,y,w,c1,c2){const h=w*0.7;const id=uid(),rid=uid();return `<g>
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${tint(c1,.12)}"/>
    <stop offset="1" stop-color="${shade(c1,.24)}"/></linearGradient>
    <linearGradient id="${rid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${tint(c2,.14)}"/>
    <stop offset="1" stop-color="${shade(c2,.2)}"/></linearGradient></defs>
  <rect x="${x}" y="${y-h}" width="${w}" height="${h}" fill="url(#${id})"/>
  <polygon points="${x-14},${y-h} ${x+w/2},${y-h-w*0.5} ${x+w+14},${y-h}" fill="url(#${rid})"/>
  <polygon points="${x+w/2},${y-h-w*0.5} ${x+w+14},${y-h} ${x+w/2},${y-h}" fill="${shade(c2,.32)}"/>
  <rect x="${x+w*0.4}" y="${y-h*0.55}" width="${w*0.2}" height="${h*0.55}" fill="#3a2418"/>
  <rect x="${x+w*0.4}" y="${y-h*0.55}" width="${w*0.2}" height="4" fill="#5a3d28"/>
  <rect x="${x+w*0.12}" y="${y-h*0.8}" width="${w*0.18}" height="${w*0.18}" fill="#bfe6f7"/>
  <rect x="${x+w*0.12}" y="${y-h*0.8}" width="${w*0.18}" height="${w*0.09}" fill="#8fd0ef"/>
  <rect x="${x+w*0.7}" y="${y-h*0.8}" width="${w*0.18}" height="${w*0.18}" fill="#bfe6f7"/>
  <rect x="${x+w*0.7}" y="${y-h*0.8}" width="${w*0.18}" height="${w*0.09}" fill="#8fd0ef"/></g>`;}
function logsFire(x,y){return `<g><rect x="${x-40}" y="${y}" width="80" height="14" rx="6" fill="#6a4a2a" transform="rotate(12 ${x} ${y})"/>
  <rect x="${x-40}" y="${y}" width="80" height="14" rx="6" fill="#5a3d24" transform="rotate(-16 ${x} ${y})"/>
  <polygon points="${x},${y-70} ${x-26},${y} ${x+26},${y}" fill="url(#fire)"/>
  <polygon points="${x},${y-44} ${x-14},${y} ${x+14},${y}" fill="#ffd23a"/></g>`;}
function fireDefs(){return grad('fire',[[0,'#ffe97a'],[.5,'#ff8a2a'],[1,'#c0301a']]);}
function rgradGlow(c,r,mode){const g=rgrad('glow',[[0,'#ffb85a'],[.5,'#ff7a2a99'],[1,'#0000']]);return mode==='defs'?g:g;}
function rgradTag(c){return '';}
function snowRidge(y){return ridge(y,180,'#8a94a0',3,.85)+snowcaps(y,180,3);}
function lava(x,y){return `<ellipse cx="${x}" cy="${y}" rx="60" ry="18" fill="#ff7a2a"/><ellipse cx="${x}" cy="${y}" rx="34" ry="10" fill="#ffe97a"/>`;}

function heroSVG(h,full){

  return `<svg viewBox="0 0 120 150">
    <defs><linearGradient id="b${h.id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/><stop offset="1" stop-color="#20232b"/></linearGradient></defs>

    <!-- body -->
    <path d="M35 150 Q35 96 60 92 Q85 96 85 150 Z" fill="${h.c1}"/>
    <path d="M42 150 L42 110 L60 100 L78 110 L78 150 Z" fill="${h.c2}" opacity=".9"/>
    <!-- arms -->
    <rect x="26" y="98" width="12" height="40" rx="6" fill="${h.c1}"/>
    <rect x="82" y="98" width="12" height="40" rx="6" fill="${h.c1}"/>
    <!-- head -->
    <circle cx="60" cy="70" r="20" fill="${h.skin}"/>

  </svg>`;
}
function heroProp(h){
  switch(h.id){
    case 'paladin': return `<polygon points="18,60 30,60 24,120" fill="#d8d0b8"/><rect x="16" y="58" width="16" height="8" fill="#c9a227"/>`;
    case 'druid': return `<rect x="96" y="40" width="6" height="90" fill="#6a4a2a"/><circle cx="99" cy="40" r="10" fill="#7fe07a"/>`;
    case 'cleric': return `<rect x="16" y="70" width="18" height="18" fill="#8f8f8f"/><rect x="20" y="88" width="10" height="30" fill="#6a5a3a"/>`;
    case 'bard': return `<ellipse cx="96" cy="100" rx="14" ry="20" fill="#c98b4a"/><rect x="94" y="60" width="4" height="42" fill="#7a5a2a"/>`;
    case 'artificer': return `<rect x="90" y="86" width="20" height="14" rx="3" fill="#8a6a3a"/><circle cx="100" cy="93" r="4" fill="#ffd23a"/>`;
    case 'barbarian': return `<rect x="94" y="44" width="6" height="70" fill="#5a3d28"/><polygon points="88,44 112,44 100,66" fill="#b7bcc4"/>`;

    `<button class="navb" onclick="go('${d}')"><span class="d">${d.toUpperCase()}</span>${WORLD[to].name}</button>`).join('');

/* =====================================================================
   7a3) AUDIO — all generated live with WebAudio: an original, gentle
        generative melody that changes mood by region, plus layered
        ambient sound per location (birds, water, wind, fire, drips).
        No audio files needed. M or the 🔊 button toggles sound.
   ===================================================================== */
const AUDIO={ctx:null,on:true,timers:[],amb:[],zone:null};
AUDIO.start=function(){
  if(AUDIO.ctx) return;
  const C=new (window.AudioContext||window.webkitAudioContext)();
  AUDIO.ctx=C; C.resume();
  AUDIO.master=C.createGain(); AUDIO.master.gain.value=.3; AUDIO.master.connect(C.destination);
  // gentle echo for space
  AUDIO.dly=C.createDelay(1); AUDIO.dly.delayTime.value=.32;
  const fb=C.createGain(); fb.gain.value=.32;
  const wet=C.createGain(); wet.gain.value=.22;
  AUDIO.dly.connect(fb); fb.connect(AUDIO.dly); AUDIO.dly.connect(wet); wet.connect(AUDIO.master);
  AUDIO.mus=C.createGain(); AUDIO.mus.gain.value=.55; AUDIO.mus.connect(AUDIO.master); AUDIO.mus.connect(AUDIO.dly);
  AUDIO.ambG=C.createGain(); AUDIO.ambG.gain.value=.8; AUDIO.ambG.connect(AUDIO.master);
  // shared noise buffer for wind/water/fire
  const len=2*C.sampleRate, buf=C.createBuffer(1,len,C.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  AUDIO.noise=buf;
  AUDIO.setLocation(S.loc);
  AUDIO.step=0; AUDIO.mi=3; musicTick();
};
AUDIO.toggle=function(){
  AUDIO.on=!AUDIO.on;
  if(AUDIO.ctx) AUDIO.master.gain.setTargetAtTime(AUDIO.on?.3:0,AUDIO.ctx.currentTime,.1);
  const b=$('mutebtn'); if(b)b.textContent=AUDIO.on?'🔊':'🔇';
  toast(AUDIO.on?'Sound <b>on</b>':'Sound <b>off</b>',900);
};
const mtof=m=>440*Math.pow(2,(m-69)/12);
// music zones: scale for the melody, chord roots for the pad, pace + feel
const MZONE={
  village:{locs:['square','hall','inn','temple','market','smithy','gate'],
    scale:[60,62,64,67,69,72,74,76], chords:[[48,55,64],[45,52,60],[41,48,57],[43,50,59]],
    beat:.62, rest:.35, type:'triangle', vel:.16, padv:.05},
  wild:{locs:['forest','clearing','lake','waterfall','vantage','trail','bridge'],
    scale:[62,64,66,69,71,74,76], chords:[[50,57,66],[47,54,62],[43,50,59],[45,52,61]],
    beat:.75, rest:.45, type:'sine', vel:.15, padv:.05},
  dark:{locs:['cave','mine','ruin','library','cemetery'],
    scale:[57,60,62,64,67,69], chords:[[45,52,60],[40,47,55]],
    beat:1.05, rest:.6, type:'sine', vel:.12, padv:.04},
  fire:{locs:['volcano'],
    scale:[50,53,55,57,60], chords:[[38,45,53]],
    beat:1.1, rest:.6, type:'sawtooth', vel:.05, padv:.03},
  magic:{locs:['portal'],
    scale:[72,74,76,79,81,84,86], chords:[[48,55,62,67]],
    beat:.85, rest:.5, type:'sine', vel:.12, padv:.05},
};
function zoneOf(loc){ for(const z in MZONE) if(MZONE[z].locs.includes(loc)) return z; return 'village'; }
function pluck(m,vel,dur,type){
  const C=AUDIO.ctx,t=C.currentTime;
  const o=C.createOscillator(),g=C.createGain();
  o.type=type; o.frequency.value=mtof(m);
  g.gain.setValueAtTime(vel,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g); g.connect(AUDIO.mus); o.start(t); o.stop(t+dur+.05);
}
function pad(ch,vel,dur){
  const C=AUDIO.ctx,t=C.currentTime;
  ch.forEach(m=>{const o=C.createOscillator(),g=C.createGain();
    o.type='sine'; o.frequency.value=mtof(m);
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vel,t+dur*.3);
    g.gain.linearRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AUDIO.mus); o.start(t); o.stop(t+dur+.1);});
}
function musicTick(){
  if(!AUDIO.ctx) return;
  const z=MZONE[zoneOf(S?S.loc:'square')];
  // original generative tune: a random walk over the zone's scale
  if(AUDIO.step%8===0) pad(z.chords[(AUDIO.step/8)%z.chords.length], z.padv, z.beat*8);
  if(Math.random()>z.rest){
    AUDIO.mi=Math.max(0,Math.min(z.scale.length-1, AUDIO.mi+[-2,-1,-1,1,1,1,2][Math.floor(Math.random()*7)]));
    pluck(z.scale[AUDIO.mi], z.vel, z.beat*1.8, z.type);
    if(Math.random()<.22) setTimeout(()=>AUDIO.ctx&&pluck(z.scale[AUDIO.mi]+12,z.vel*.4,z.beat,z.type), z.beat*500);
  }
  AUDIO.step++;
  AUDIO.mtimer=setTimeout(musicTick, MZONE[zoneOf(S?S.loc:'square')].beat*1000);
}
/* ---- ambience layers ---- */
function ambNoise(freq,q,gain,lfoRate,lfoDepth){
  const C=AUDIO.ctx;
  const src=C.createBufferSource(); src.buffer=AUDIO.noise; src.loop=true;
  const f=C.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=C.createGain(); g.gain.value=gain;
  src.connect(f); f.connect(g); g.connect(AUDIO.ambG); src.start();
  let lfo=null,lg=null;
  if(lfoRate){ lfo=C.createOscillator(); lg=C.createGain();
    lfo.frequency.value=lfoRate; lg.gain.value=lfoDepth;
    lfo.connect(lg); lg.connect(g.gain); lfo.start(); }
  return {stop(){try{src.stop();lfo&&lfo.stop();}catch(e){} [src,f,g,lg].forEach(n=>n&&n.disconnect&&n.disconnect());}};
}
function ambTimer(fn,min,max){
  let alive=true;
  (function next(){ if(!alive)return;
    AUDIO.timers.push(setTimeout(()=>{ if(!alive)return; fn(); next(); },(min+Math.random()*(max-min))*1000)); })();
  return {stop(){alive=false;}};
}
function chirp(){ const C=AUDIO.ctx,t=C.currentTime;
  for(let i=0;i<1+Math.floor(Math.random()*3);i++){
    const o=C.createOscillator(),g=C.createGain(),t0=t+i*.14;
    o.type='sine'; const f=2400+Math.random()*1600;
    o.frequency.setValueAtTime(f,t0); o.frequency.linearRampToValueAtTime(f+500,t0+.05);
    o.frequency.linearRampToValueAtTime(f-300,t0+.11);
    g.gain.setValueAtTime(.0001,t0); g.gain.linearRampToValueAtTime(.05,t0+.02);
    g.gain.linearRampToValueAtTime(.0001,t0+.12);
    o.connect(g); g.connect(AUDIO.ambG); o.start(t0); o.stop(t0+.15);} }
function drip(){ const C=AUDIO.ctx,t=C.currentTime;
  const o=C.createOscillator(),g=C.createGain();
  o.type='sine'; o.frequency.setValueAtTime(900+Math.random()*500,t);
  o.frequency.exponentialRampToValueAtTime(280,t+.14);
  g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.0008,t+.35);
  o.connect(g); g.connect(AUDIO.ambG); g.connect(AUDIO.dly); o.start(t); o.stop(t+.4); }
function crackle(){ const C=AUDIO.ctx,t=C.currentTime;
  const src=C.createBufferSource(); src.buffer=AUDIO.noise;
  src.playbackRate.value=.6+Math.random()*1.6;
  const f=C.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500+Math.random()*2500; f.Q.value=2;
  const g=C.createGain(); g.gain.setValueAtTime(.05+Math.random()*.05,t);
  g.gain.exponentialRampToValueAtTime(.0008,t+.05+Math.random()*.06);
  src.connect(f); f.connect(g); g.connect(AUDIO.ambG); src.start(t); src.stop(t+.15); }
// which layers play where (tweak freely)
const AMB={
  square:['birds'], hall:[], inn:[], temple:[], market:['birds'], smithy:['fire'],
  gate:['birds'], cemetery:['windq'],
  forest:['birds','windq'], clearing:['fire','birdsq'], lake:['water','birdsq'],
  waterfall:['waterbig'], cave:['drips','windq'], mine:['fire','drips'],
  bridge:['wind','waterq'], trail:['wind'], vantage:['wind','birdsq'],
  volcano:['firebig','windq'], ruin:['windq','drips'], library:['dripsq'], portal:['windq','drips'],
};
AUDIO.setLocation=function(loc){
  if(!AUDIO.ctx) return;
  AUDIO.amb.forEach(a=>a.stop()); AUDIO.amb=[];
  AUDIO.timers.forEach(t=>clearTimeout(t)); AUDIO.timers=[];
  (AMB[loc]||[]).forEach(k=>{
    if(k==='birds') AUDIO.amb.push(ambTimer(chirp,2,6));
    if(k==='birdsq') AUDIO.amb.push(ambTimer(chirp,5,12));
    if(k==='water') AUDIO.amb.push(ambNoise(500,1.2,.05,.4,.02));
    if(k==='waterq') AUDIO.amb.push(ambNoise(500,1.2,.025,.4,.012));
    if(k==='waterbig') AUDIO.amb.push(ambNoise(800,.8,.11,.25,.03));
    if(k==='wind') AUDIO.amb.push(ambNoise(220,.7,.05,.15,.03));
    if(k==='windq') AUDIO.amb.push(ambNoise(220,.7,.028,.12,.016));
    if(k==='fire'){ AUDIO.amb.push(ambNoise(1600,1.5,.02,0,0)); AUDIO.amb.push(ambTimer(crackle,.12,.5)); }
    if(k==='firebig'){ AUDIO.amb.push(ambNoise(900,.9,.05,0,0)); AUDIO.amb.push(ambTimer(crackle,.08,.3)); }
    if(k==='drips') AUDIO.amb.push(ambTimer(drip,2.5,7));
    if(k==='dripsq') AUDIO.amb.push(ambTimer(drip,6,14));
  });
};

/* ---------- camera: the scene is zoomed and pans with the player ---------- */
const CAMZ=1.30;
function updateCamera(dt){
  const tx=Math.max(-10,Math.min(10,(S.px-50)*.34));
  const ty=Math.max(-5,Math.min(5,(S.py-74)*.22));
  const k=Math.min(1,dt*4.5);
  E2.cam.x+=(tx-E2.cam.x)*k; E2.cam.y+=(ty-E2.cam.y)*k;
  E2.kick=E2.kick||1; E2.kick+=(1-E2.kick)*Math.min(1,dt*2.2);   // arrival zoom settle
  const tr=`scale(${(CAMZ*E2.kick).toFixed(4)}) translate(${-E2.cam.x}%,${-E2.cam.y}%)`;
  scene.style.transform=tr; $('world').style.transform=tr;
}

/* ---------- footsteps: dust puffs + soft step sounds ---------- */
const OUTDOOR=['square','gate','market','cemetery','forest','clearing','lake',
  'waterfall','mine','bridge','trail','vantage','volcano','ruin'];
function footstep(){
  if(OUTDOOR.includes(S.loc)){
    const d=document.createElement('div'); d.className='dust';
    d.style.left=(S.px+(Math.random()*2-1))+'%'; d.style.top=(S.py+.5)+'%';
    d.style.zIndex=Math.round(S.py*10)-1;
    $('world').appendChild(d); setTimeout(()=>d.remove(),520);
  }
  if(AUDIO.ctx&&AUDIO.on){
    const C=AUDIO.ctx,t=C.currentTime;
    const src=C.createBufferSource(); src.buffer=AUDIO.noise;
    src.playbackRate.value=.4+Math.random()*.3;
    const f=C.createBiquadFilter(); f.type='bandpass';
    f.frequency.value=300+Math.random()*250; f.Q.value=1.5;
    const g=C.createGain(); g.gain.setValueAtTime(.05,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.09);
    src.connect(f);f.connect(g);g.connect(AUDIO.ambG);
    src.start(t); src.stop(t+.1);
  }
}

// choose front / side / back art based on movement direction
function setPose(dx,dy){
  if(!E2.pset) return;
  let pose='front', flip=1;
  if(dx||dy){
    if(Math.abs(dy)>Math.abs(dx)*1.4) pose = dy<0?'back':'front';
    else { pose='side'; flip = (dx>0)===(SPRITESETS[E2.pset].dir>0)?1:-1; }
  } else { pose=E2.ppose==='back'?'back':'front'; flip=S.pf; }
  S.pf=flip;
  if(pose!==E2.ppose){
    E2.ppose=pose;
    const img=document.getElementById('pimg');
    if(img) img.src=A(sprPath(E2.pset,pose));
  }
}

function placeSprite(el,x,y,f){
  const s=.58+.58*Math.max(0,Math.min(1,(y-BAND.top)/(BAND.bot-BAND.top)));
  const base=+(el.dataset.h||15);
  el.style.left=x+'%'; el.style.top=y+'%';
  el.style.height=(base*s)+'%'; el.style.aspectRatio=el.dataset.ar||'3/5';
  el.style.transform=`translate(-50%,-100%) scaleX(${f})`;
  el.style.zIndex=Math.round(y*10);
}
function dist2(ax,ay,bx,by){const dx=(ax-bx)*1.78,dy=ay-by;return dx*dx+dy*dy;}

function tick(t){
  E2.raf=requestAnimationFrame(tick);
  const dt=Math.min(.05,(t-E2.last)/1000)||0; E2.last=t;
  if(!S||S.dead||anyModal()||!document.body.classList.contains('walkmode')) return;
  // ---- player movement ----
  let dx=0,dy=0;
  if(E2.keys.has('a')||E2.keys.has('arrowleft'))dx-=1;
  if(E2.keys.has('d')||E2.keys.has('arrowright'))dx+=1;
  if(E2.keys.has('w')||E2.keys.has('arrowup'))dy-=1;
  if(E2.keys.has('s')||E2.keys.has('arrowdown'))dy+=1;
  const moving=dx||dy;
  if(moving){
    if(dx&&dy){dx*=.72;dy*=.72;}
    S.px=Math.max(0,Math.min(100,S.px+dx*PSPEED.x*dt));
    S.py=Math.max(BAND.top,Math.min(BAND.bot+2,S.py+dy*PSPEED.y*dt));
    if(E2.pset) setPose(dx,dy); else if(dx)S.pf=dx>0?1:-1;
    E2.player.classList.add('walking');
    E2.stepT=(E2.stepT||0)-dt;
    if(E2.stepT<=0){ E2.stepT=.34; footstep(); }
    // ---- edge exits ----
    const L=WORLD[S.loc];
    if(S.px<=0.5&&L.links.w) return transition('w');
    if(S.px>=99.5&&L.links.e) return transition('e');
    if(S.py<=BAND.top+0.4&&dy<0&&L.links.n) return transition('n');
    if(S.py>=BAND.bot+1.6&&L.links.s) return transition('s');
  } else E2.player.classList.remove('walking');
  placeSprite(E2.player,S.px,S.py,S.pf);
  // ---- item pickup ----
  E2.items.forEach(it=>{
    if(!it.got&&dist2(S.px,S.py,it.x,it.y)<16){
      it.got=true; it.el.remove();
      if(it.k==='gold'){const g=3+Math.floor(Math.random()*4);S.gold+=g;toast(`Picked up <b>${g} gold</b>`,1200);}
      else{give(it.k,1);toast(`Picked up <b>${ITEMS[it.k].name}</b>`,1200);}
      drawWhud();drawQBadge();
    }});
  // ---- NPC wander ----
  E2.npcs.forEach(o=>{
    const near=dist2(S.px,S.py,o.x,o.y)<90;
    if(near){ o.el.classList.remove('walking'); o.f=(S.px<o.x)?-1:1; }
    else{
      const ddx=o.tx-o.x, ddy=o.ty-o.y, d=Math.hypot(ddx*1.78,ddy);
      if(d<1){ o.wait-=dt;
        if(o.wait<=0){ o.tx=Math.max(4,Math.min(96,o.home.x+(Math.random()*36-18)));
          o.ty=Math.max(BAND.top+2,Math.min(BAND.bot,o.home.y+(Math.random()*14-7)));
          o.wait=1.5+Math.random()*3; }
        o.el.classList.remove('walking');
      } else { const sp=7*dt; o.x+=ddx/d*sp*1.0; o.y+=ddy/d*sp*.6;
        if(Math.abs(ddx)>.3)o.f=ddx>0?1:-1; o.el.classList.add('walking'); }
    }
    placeSprite(o.el,o.x,o.y,o.f);
  });
  // ---- enemy AI: wander, chase, strike ----
  E2.atkCd=Math.max(0,E2.atkCd-dt);
  E2.enemies.forEach(o=>{
    if(o.dead) return;
    o.atkT=Math.max(0,o.atkT-dt);
    const d2=dist2(S.px,S.py,o.x,o.y);
    if(d2<28){                                   // in striking range
      o.el.classList.remove('walking'); o.f=(S.px<o.x)?-1:1;
      if(o.atkT<=0){
        o.atkT=1.15;
        let dmg=o.T.dmg;
        if(S.hero.id==='golem')dmg=Math.round(dmg*.7);
        if(S.hero.id==='paladin')dmg=Math.round(dmg*.85);
        S.hp-=dmg; dmgNum(S.px,S.py,'-'+dmg,'hurt');
        drawWhud(); checkDeath();
      }
    } else if(d2<o.T.aggro*o.T.aggro){           // chase
      const dx2=S.px-o.x, dy2=S.py-o.y, d=Math.hypot(dx2*1.78,dy2)||1;
      o.x+=dx2/d*o.T.spd*dt; o.y+=dy2/d*o.T.spd*.6*dt;
      o.y=Math.max(BAND.top+1,Math.min(BAND.bot+1,o.y));
      o.f=dx2>0?1:-1; o.el.classList.add('walking');
    } else {                                     // wander
      const ddx=o.tx-o.x, ddy=o.ty-o.y, d=Math.hypot(ddx*1.78,ddy);
      if(d<1){ o.wait-=dt;
        if(o.wait<=0){ o.tx=Math.max(6,Math.min(94,o.x+(Math.random()*30-15)));
          o.ty=Math.max(BAND.top+2,Math.min(BAND.bot,o.y+(Math.random()*12-6)));
          o.wait=1.5+Math.random()*3; }
        o.el.classList.remove('walking');
      } else { o.x+=ddx/d*4*dt; o.y+=ddy/d*2.4*dt;
        if(Math.abs(ddx)>.3)o.f=ddx>0?1:-1; o.el.classList.add('walking'); }
    }
    placeSprite(o.el,o.x,o.y,o.f);
    const bar=o.el.querySelector('.ebar');
    if(o.hp<o.T.hp){ bar.classList.add('show');
      bar.querySelector('.f').style.transform=`scaleX(${Math.max(0,o.hp/o.T.hp)})`; }
  });
  // ---- interact prompt ----
  updatePrompt();
  // ---- camera follows the player ----
  updateCamera(dt);
}

/* player attack — E or Space near an enemy */
function nearestEnemy(r){
  let best=null,bd=r*r;
  E2.enemies.forEach(o=>{ if(o.dead)return;
    const d=dist2(S.px,S.py,o.x,o.y); if(d<bd){bd=d;best=o;} });
  return best;
}
function attack(){
  if(E2.atkCd>0) return;
  const o=nearestEnemy(11); if(!o) return false;
  E2.atkCd = S.hero.id==='monk'? .34 : .55;
  E2.player.classList.remove('atk'); void E2.player.offsetWidth; E2.player.classList.add('atk');
  S.pf = o.x>S.px?1:-1;
  let dmg=heroAtk(), crit=false;
  if(S.hero.id==='assassin'&&Math.random()<.3){dmg*=2;crit=true;}
  o.hp-=dmg; o.hurtT=.15;
  o.el.classList.add('ehurt'); setTimeout(()=>o.el.classList.remove('ehurt'),140);
  dmgNum(o.x,o.y,(crit?'✦':'')+'-'+dmg,crit?'crit':'hit');
  // small knockback
  const kd=Math.hypot((o.x-S.px)*1.78,o.y-S.py)||1;
  o.x=Math.max(3,Math.min(97,o.x+(o.x-S.px)/kd*2.2));
  if(o.hp<=0){
    o.dead=true; o.el.classList.add('edie');
    setTimeout(()=>o.el.remove(),520);
    S.gold+=o.T.gold;
    let extra='';
    if(o.t==='minotaur'){ give('sulfur',1); extra=' and a <b>Sunstone</b>'; }
    if(o.t==='skeleton'&&Math.random()<.4){ give('bread',1); extra=' and <b>Bread</b>'; }
    toast(`${o.T.name} defeated! <b>+${o.T.gold} gold</b>${extra}`,1900);
    drawWhud(); drawQBadge();
  }
  return true;
}

function nearestTarget(){
  let best=null,bd=110;
  E2.npcs.forEach(o=>{const d=dist2(S.px,S.py,o.x,o.y);if(d<bd){bd=d;best={t:'npc',o};}});
  const R=ROAM[S.loc];
  if(R&&R.hot){const d=dist2(S.px,S.py,R.hot.x,R.hot.y);if(d<bd){bd=d;best={t:'hot'};}}
  return best;
}
function updatePrompt(){
  const L=WORLD[S.loc]; const ep=$('ep');
  const foe=nearestEnemy(12);
  if(foe){ ep.innerHTML=`Press <span class="k">[E]</span> to Attack ${foe.T.name}!`;
    ep.classList.add('show'); return; }
  const tgt=nearestTarget();
  if(!tgt){ep.classList.remove('show');return;}
  if(tgt.t==='npc'){
    const n=tgt.o.n; let mark='';
    if(n.trade) mark='';
    else if(n.mainquest) mark = S.quest===0?' !':(S.quest===2?' ✓':'');
    else { const st=S.quests[tgt.o.id];
      mark = st==='done'?'':(st==='active'?(questMet(n)?' ✓':' …'):' !'); }
    ep.innerHTML=`Press <span class="k">[E]</span> to ${n.trade?'Trade with':'Talk to'} ${n.name}${mark}`;
  } else if(actionAvailable(L)){
    ep.innerHTML=`Press <span class="k">[E]</span> ${L.prompt}`;
  } else {ep.classList.remove('show');return;}
  ep.classList.add('show');
}
function interact(){
  if(S.dead)return;
  if(attack()) return;          // an enemy in range takes priority
  const tgt=nearestTarget();
  if(!tgt)return;
  if(tgt.t==='npc'){ const n=tgt.o.n; n.trade?openTrade():talkNPC(tgt.o.id); }
  else doAction();
  drawWhud();
}

function transition(dir){
  const L=WORLD[S.loc]; const to=L.links[dir]; if(!to)return;
  let cost=8; if(S.hero.id==='bard')cost=4; if(S.buff.boots)cost=Math.max(2,cost-3);
  const f=$('fade'); f.classList.add('on');
  E2.keys.clear();
  setTimeout(()=>{
    S.loc=to; spend(cost);
    if(S.hero.id==='monk')S.sta=Math.min(S.maxsta,S.sta+3);
    AUDIO.setLocation(to);   // swap ambient sound layers for the new area
    E2.kick=1.06;            // small zoom settle on arrival
    // enter from the opposite edge
    if(dir==='w')S.px=97; else if(dir==='e')S.px=3;
    else if(dir==='n'){S.py=BAND.bot;S.px=Math.max(4,Math.min(96,S.px));}
    else if(dir==='s'){S.py=BAND.top+2;S.px=Math.max(4,Math.min(96,S.px));}
    render(); f.classList.remove('on');
  },240);
}

/* ---------- hotbar + inventory ---------- */
function drawWhud(){
  $('whpf').style.transform=`scaleX(${Math.max(0,S.hp/S.maxhp)})`;
  $('wstaf').style.transform=`scaleX(${Math.max(0,S.sta/S.maxsta)})`;
  $('whpt').textContent=`${Math.max(0,Math.round(S.hp))}/${S.maxhp}`;
  $('wstat').textContent=`${Math.max(0,Math.round(S.sta))}/${S.maxsta}`;
  $('wloc').textContent=WORLD[S.loc].name;
  $('wgold').textContent=S.gold;
  document.body.classList.toggle('hurt',S.hp>0&&S.hp/S.maxhp<0.25);
  // hotbar
  let h='';
  for(let i=0;i<5;i++){
    const k=S.hot[i]; const cnt=k?(S.bag[k]||0):0;
    if(k&&cnt<=0){S.hot[i]=null;}
    const kk=S.hot[i];
    h+=`<div class="slot ${kk?'':'empty'}" onclick="useSlot(${i})" title="${kk?ITEMS[kk].name:'empty'}">
      <span class="num">${i+1}</span><span class="ico">${kk?ICON[kk]||'❔':'·'}</span>
      ${kk?`<span class="cnt">${S.bag[kk]||0}</span>`:''}</div>`;
  }
  $('hotbar').innerHTML=h;
}
function useSlot(i){
  const k=S.hot[i]; if(!k){toast('Empty slot — assign items from your inventory (Tab).',1400);return;}
  if(!has(k)){S.hot[i]=null;drawWhud();return;}
  const it=ITEMS[k];
  if(it.food!=null||it.sta!=null){ eatItem(k); }
  else toast(`<b>${it.name}</b> — a quest item. Someone in the valley needs this.`,1600);
  drawWhud();
}
function eatItem(k){
  const it=ITEMS[k]; take(k,1);
  S.hp=Math.min(S.maxhp,S.hp+(it.food||0)); S.sta=Math.min(S.maxsta,S.sta+(it.sta||0));
  toast(`You use <b>${it.name}</b>. ${it.food?('+'+it.food+' health '):''}${it.sta?('+'+it.sta+' energy'):''}`,1500);
  drawWhud();
}
function toggleInv(on){
  const m=$('inv'); const want=on!=null?on:!m.classList.contains('on');
  m.classList.toggle('on',want);
  if(want)drawInv();
}
function drawInv(){
  const g=$('invGrid'); const keys=Object.keys(S.bag);
  if(!keys.length){g.innerHTML='<div class="sub" style="grid-column:1/-1">Your bag is empty — explore, gather and trade.</div>';return;}
  g.innerHTML=keys.map(k=>{
    const inhot=S.hot.includes(k);
    return `<div class="invItem ${inhot?'inhot':''}" onclick="invClick('${k}')">
      <span class="cnt">×${S.bag[k]}</span><div class="ico">${ICON[k]||'❔'}</div>
      <div class="nm">${ITEMS[k].name}</div></div>`;}).join('');
}
function invClick(k){
  const i=S.hot.indexOf(k);
  if(i>=0){S.hot[i]=null;toast(`<b>${ITEMS[k].name}</b> removed from hotbar.`,1100);}
  else{const free=S.hot.indexOf(null);
    if(free<0){toast('Hotbar full — remove something first.',1400);return;}
    S.hot[free]=k;toast(`<b>${ITEMS[k].name}</b> → hotbar slot ${free+1}.`,1100);}
  drawInv();drawWhud();
}

/* ---------- trader (buy AND sell, Zelda-style economy) ---------- */
const SELL={iron:8,sulfur:8,crystal:10,fish:4,berries:2,bread:3,stew:9,potion:10};
function openTrade(){
  const stock=[['bread',5],['fish',9],['stew',16],['potion',14]];
  const sellable=Object.keys(S.bag).filter(k=>SELL[k]&&S.bag[k]>0);
  openInfo(`<h1 style="font-size:1.6vw">Trader</h1><div class="sub">Gold: <b>${S.gold}</b></div>
    <div class="row" style="align-items:flex-start">
      <div style="flex:1"><h2 style="text-align:left">Buy</h2><div class="kv">
        ${stock.map(([k,c])=>`<div>${ICON[k]} ${ITEMS[k].name} — <b>${c}g</b>
          <button class="big" style="padding:.2vh .8vw;font-size:.85vw;margin-left:.6vw" onclick="tradeBuy('${k}',${c})">Buy</button></div>`).join('')}
      </div></div>
      <div style="flex:1"><h2 style="text-align:left">Sell</h2><div class="kv">
        ${sellable.length?sellable.map(k=>`<div>${ICON[k]} ${ITEMS[k].name} ×${S.bag[k]} — <b>${SELL[k]}g</b>
          <button class="big" style="padding:.2vh .8vw;font-size:.85vw;margin-left:.6vw" onclick="tradeSell('${k}')">Sell</button></div>`).join('')
          :'<div style="opacity:.7">Nothing to sell yet — gather ore, crystals, fish…</div>'}
      </div></div>
    </div>
    <div class="btnbar"><button class="big" onclick="closeInfo()">Leave</button></div>`);
}
function tradeBuy(k,c){ if(S.gold<c){toast('Not enough gold.',1200);return;} S.gold-=c; give(k,1); openTrade(); drawWhud(); }
function tradeSell(k){ if(!has(k))return; take(k,1); S.gold+=SELL[k]; openTrade(); drawWhud(); }

/* =====================================================================
   8) MOVEMENT + TICK
   ===================================================================== */
function go(dir){
  if(S.dead) return;
  const L=WORLD[S.loc]; const to=L.links[dir]; if(!to) return;
  let cost = 12;
  if(S.hero.id==='bard') cost=6;
  if(S.buff.boots) cost=Math.max(3,cost-5);
  // fade transition
  const f=$('fade'); f.classList.add('on');
  setTimeout(()=>{
    S.loc=to; spend(cost);
    if(S.hero.id==='monk') S.sta=Math.min(S.maxsta,S.sta+4); // inner calm
    render(); f.classList.remove('on');
  },260);
}
function spend(sta){
  S.sta -= sta;
  if(S.sta<0){ // exhaustion drains health
    if(S.hero.id!=='golem'){ S.hp += S.sta; } S.sta=0;
    toast('You are <b>exhausted</b> — eat or rest.',1800);
  }
  checkDeath();
}
function starve(){ // called on some actions/time
  const drain = S.hero.id==='golem'?1:3;
  S.sta=Math.max(0,S.sta-drain);
}
function checkDeath(){
  if(S.hp<=0 && !S.dead){ S.hp=0; S.dead=true; render();
    openInfo(`<h1 class="dead">You have fallen</h1><div class="sub">${S.hero.name} could go no further.</div>
      <div class="btnbar"><button class="big" onclick="location.reload()">Try Again</button></div>`);
  }
}

function npcsAt(loc){ return Object.entries(NPCS).filter(([id,n])=>n.loc===loc); }
function questMet(n){
  if(n.need.flag) return !!S.flags[n.need.flag];
  if(n.need.item) return (S.bag[n.need.item]||0)>0;
  if(n.need.items){} // (unused shorthand)
  return Object.entries(n.need).filter(([k])=>!['flag','item','items'].includes(k))
    .every(([k,v])=>(S.bag[k]||0)>=v);
}
function heroFace(){
  const h=S.hero;
  return h.portrait
    ? `<img src="${A(h.portrait)}" style="width:100%;border-radius:10px;object-fit:cover;object-position:50% 20%;max-height:34vh">`
    : heroSVG(h,true);
}
function talkNPC(id){
  const n=NPCS[id];
  if(n.mainquest){ ACTIONS.mayor(); drawQBadge(); return; }
  if(n.trade){ openTrade(); return; }
  const st=S.quests[id];
  const face=`<div style="flex:0 0 26%">${heroFace()}</div>`;
  if(!st){
    openInfo(`<div class="row">${face}<div><h2 style="text-align:left">${n.name} — “${n.title}”</h2>
      <div class="kv" style="margin-top:.6vh">${n.offer}</div></div></div>
      <div class="btnbar"><button class="big" onclick="acceptQuest('${id}')">Accept Quest</button>
      <button class="big" onclick="closeInfo()">Not now</button></div>`);
  } else if(st==='active'){
    if(questMet(n)){
      n.reward(); S.quests[id]='done';
      openInfo(`<div class="row">${face}<div><h2 style="text-align:left">${n.name}</h2>
        <div class="kv" style="margin-top:.6vh">Quest complete! ${n.rewardText}</div></div></div>
        <div class="btnbar"><button class="big" onclick="closeInfo();render()">Wonderful</button></div>`);
      toast(`Quest complete: <b>${n.title}</b>`,2200);
    } else {
      openInfo(`<div class="row">${face}<div><h2 style="text-align:left">${n.name}</h2>
        <div class="kv" style="margin-top:.6vh">${n.reminder}</div></div></div>
        <div class="btnbar"><button class="big" onclick="closeInfo()">On it</button></div>`);
    }
  } else {
    openInfo(`<div class="row">${face}<div><h2 style="text-align:left">${n.name}</h2>
      <div class="kv" style="margin-top:.6vh">${n.done}</div></div></div>
      <div class="btnbar"><button class="big" onclick="closeInfo()">Farewell</button></div>`);
  }
}
function acceptQuest(id){ S.quests[id]='active'; closeInfo();
  toast(`New quest: <b>${NPCS[id].title}</b>`,2200); render(); }

  if(L.act==='travel'||L.act==='look'||L.act==='examine'||L.act==='cross') return true;
  if(L.act==='enterRuin' && S.ruinOpen) return false;
  return true;
}

  enterRuin(){ if(S.hero.id==='warlock'||S.hero.id==='assassin'||has('page')){ S.ruinOpen=true;
      toast('The ancient door yields. The ruin opens before you.',2000); render(); }
    else { openDialog('Sealed Door','Runes bind this door. Perhaps the <b>Library</b> beyond holds the way — or a Warlock could read these marks.'); S.ruinOpen=true; render(); } },
  chronicle(){ if(!has('page')){ give('page',1);
      toast('You copy a <b>Chronicle Page</b> — the rite to wake the Sunwell.',2400); }
    else toast('The shelves hold a thousand tomes, all long dead languages.',1900); render(); },
  portal(){ const miss=[['iron','Iron Ore'],['sulfur','Sunstone'],['page','Chronicle Page']].filter(x=>!has(x[0])).map(x=>x[1]);
    if(miss.length){ openDialog('Portal Ruin','The portal is dormant. You still need: '+miss.join(', ')+'.'); return; }
    take('iron',1); take('sulfur',1); take('page',1); S.quest=3; win(); },
};
function doAction(){
  if(S.dead) return; const L=WORLD[S.loc];
  if(!actionAvailable(L)) return;
  (ACTIONS[L.act]||(()=>{}))();
  drawQuest();
}

function win(){
  render();
  openInfo(`<h1>The Sunwell Rekindled</h1>
    <div class="sub">${S.hero.name} channels Iron, Sunstone and the ancient rite into the portal.
    Light pours back into the valley of Valegends.</div>
    <div class="btnbar"><button class="big" onclick="location.reload()">Play Again</button></div>`);
}

/* =====================================================================
   10) INVENTORY / SHOP / DIALOG / INFO
   ===================================================================== */
function give(k,n=1){ if(k==='gold'){S.gold+=n;return;} S.bag[k]=(S.bag[k]||0)+n; }
function take(k,n=1){ S.bag[k]=(S.bag[k]||0)-n; if(S.bag[k]<=0) delete S.bag[k]; }
function has(k,n=1){ return (S.bag[k]||0)>=n; }
function eat(){
  if(S.dead) return;
  const order=['potion','stew','fish','bread','berries','crystal'];
  const k=order.find(x=>S.bag[x]>0);
  if(!k){toast('Nothing to eat. Forage, fish or cook.',1600);return;}
  S.bag[k]--; if(S.bag[k]<=0) delete S.bag[k];
  const it=ITEMS[k]; S.hp=Math.min(S.maxhp,S.hp+(it.food||0)); S.sta=Math.min(S.maxsta,S.sta+(it.sta||0));
  toast(`You eat <b>${it.name}</b>. ${it.food?('+'+it.food+' health '):''}${it.sta?('+'+it.sta+' stamina'):''}`,1700);
  render();
}
function openShop(){
  const stock=[['bread',6],['fish',10],['stew',18]];
  openInfo(`<h1>Alchemist Market</h1><div class="sub">Gold: <b>${S.gold}</b></div>
    <div class="kv">${stock.map(([k,c])=>`<div>${ITEMS[k].name} — <b>${c}g</b>
      <button class="big" style="padding:.3vh 1vw;font-size:.9vw;margin-left:1vw" onclick="buy('${k}',${c})">Buy</button></div>`).join('')}</div>
    <div class="bag">${bagPills()}</div>
    <div class="btnbar"><button class="big" onclick="closeInfo()">Leave</button></div>`);
}
function buy(k,c){ if(S.gold<c){toast('Not enough gold.',1400);return;} S.gold-=c; give(k,1); openShop(); render(); }
function bagPills(){
  const p=Object.entries(S.bag).map(([k,n])=>`<span class="pill">${ITEMS[k]?ITEMS[k].name:k} <b>×${n}</b></span>`);
  p.unshift(`<span class="pill">Gold <b>${S.gold}</b></span>`);
  return p.join('');
}
function openDialog(who,text){
  openInfo(`<div class="row"><div style="flex:0 0 26%">${heroFace()}</div>
    <div><h2 style="text-align:left">${who}</h2><div class="kv" style="margin-top:.6vh">${text}</div></div></div>
    <div class="btnbar"><button class="big" onclick="closeInfo()">Continue</button></div>`);
}
function openInfo(html){ $('infoCard').innerHTML=html; $('info').classList.add('on'); }
function closeInfo(){ $('info').classList.remove('on'); }
function heroInfo(){
  const h=S.hero;
  openInfo(`<div class="row"><div style="flex:0 0 30%">${heroFace()}</div>
    <div><h1 style="text-align:left">${h.name}</h1><h2 style="text-align:left">${h.role}</h2>
    <div class="kv"><b>Health:</b> ${Math.round(S.hp)}/${S.maxhp} &nbsp; <b>Stamina:</b> ${Math.round(S.sta)}/${S.maxsta}<br>
    <b>Skill:</b> ${h.skill}</div>
    <div class="bag">${bagPills()}</div></div></div>
    <div class="btnbar"><button class="big" onclick="closeInfo()">Close</button></div>`);
}

/* =====================================================================
   11) INPUT + BOOT
   ===================================================================== */
const MOVE_KEYS=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  // let Esc/Enter close the Instructions even on the start menu
  if($('info').classList.contains('on')){ if(k==='escape'||k==='enter') closeInfo(); return; }
  if($('pick').classList.contains('on')) return;
  if(k==='tab'){ e.preventDefault(); toggleInv(); return; }
  if($('inv').classList.contains('on')){ if(k==='escape') toggleInv(false); return; }
  const walk=document.body.classList.contains('walkmode');
  if(walk && MOVE_KEYS.includes(k)){ e.preventDefault(); E2.keys.add(k); return; }
  if(!walk){ // legacy screen-hop controls
    if(k==='w'||k==='arrowup') return go('n');
    if(k==='s'||k==='arrowdown') return go('s');
    if(k==='a'||k==='arrowleft') return go('w');
    if(k==='d'||k==='arrowright') return go('e');
  }
  if(k==='e'||k===' '){ e.preventDefault(); walk?interact():doAction(); }
  else if(k==='f') eat();
  else if(k==='i') heroInfo();
  else if(k==='m') AUDIO.toggle();
  else if(['1','2','3','4','5'].includes(k)) useSlot(+k-1);
});
addEventListener('keyup',e=>{ E2.keys.delete(e.key.toLowerCase()); });
addEventListener('blur',()=>E2.keys.clear());
$('eBtn').onclick=doAction;

function toast(html,ms=2000){ toastEl.innerHTML=html; toastEl.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),ms); }

// build hero picker
$('heroGrid').innerHTML = HEROES.map(h=>`
  <div class="hero" onclick="newGame('${h.id}')">
    ${h.portrait?`<img src="${A(h.portrait)}" style="width:100%;height:15vh;object-fit:cover;object-position:50% 22%;border-radius:8px" onerror="this.outerHTML='${heroSVG(h).replace(/'/g,"&#39;")}'">`:heroSVG(h)}
    <div class="nm">${h.name}</div><div class="cl">${h.role}</div>
    <div class="sk">${h.skill}</div>
  </div>`).join('');

// starvation over time (gentle survival pressure)
setInterval(()=>{ if(S&&!S.dead && !$('info').classList.contains('on')){
  const before=S.sta; starve();
  if(S.sta<=0){ if(S.hero.id!=='golem'){S.hp-=2; checkDeath();} }
  if(Math.abs(before-S.sta)>0) render();
}}, 6000);
</script>
